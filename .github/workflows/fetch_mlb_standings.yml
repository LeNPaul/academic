name: Fetch MLB Standings

on:
  schedule:
    - cron: "0 12 * * *"  # Run daily at 12:00 PM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch_standings:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # Install requests library
      - name: Install dependencies
        run: pip install requests

      # Execute the Python script
      - name: Fetch MLB Standings
        run: python scripts/fetch_mlb_standings.py

      # Commit and push changes
      - name: Commit updated standings file
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add _data/mlb_standings.json
          git commit -m "Update MLB standings: $(date)"
          git push